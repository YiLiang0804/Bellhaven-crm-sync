name: daily-bellhaven-crm-sync
on:
  schedule:
    - cron: "0 11 * * *"   # 06:00 US Eastern, daily
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      # restore the decision ledger so already-decided proposals are not re-proposed
      - uses: actions/cache@v4
        with:
          path: data/decisions.sqlite
          key: decisions-${{ github.run_id }}
          restore-keys: decisions-
      - run: python run.py
        env:
          CRM_TOKEN: ${{ secrets.CRM_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: proposals
          path: data/proposals.json
